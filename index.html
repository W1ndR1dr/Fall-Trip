<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Our Eastern Sierra fall color weekend." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fall Trip" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4eee5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0a07" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Fall Trip</title>
    <script>
      // Resolve the theme before first paint (no flash). Mirrors src/lib/theme.ts:
      // night vision wins; then the Light/Dark override; then the device.
      (function () {
        var C = { light: '#f4eee5', dark: '#0e0a07', night: '#050202' };
        var d = document.documentElement, t = 'light', pref = 'auto';
        try {
          pref = JSON.parse(localStorage.getItem('falltrip:theme') || '"auto"');
          var nv = JSON.parse(localStorage.getItem('falltrip:nightVision') || 'false');
          t = nv === true ? 'night' : pref === 'light' || pref === 'dark' ? pref : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        d.dataset.theme = t;
        d.style.colorScheme = t === 'light' ? 'light' : 'dark';
        if (t === 'night' || pref === 'light' || pref === 'dark')
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = C[t]; });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Fall Trip needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
